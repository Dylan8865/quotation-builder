  :root {
    --navy: #1f2a5c;
    --teal: #1aa6a6;
    --ink: #1c2030;
    --muted: #6a7085;
    --line: #d9dce6;
    --bg: #eef0f5;
    --panel: #ffffff;
    --danger: #b3261e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif; color: var(--ink); background: var(--bg); font-size: 14px; }
  button, input, select, textarea { font: inherit; color: inherit; }

  .app { display: grid; grid-template-columns: minmax(360px, 480px) 1fr; height: 100vh; }
  .panel { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .topbar { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
  .topbar h1 { font-size: 16px; margin: 0; flex: 1; color: var(--navy); }
  .form { overflow-y: auto; padding: 4px 18px 40px; flex: 1; }
  .preview { overflow: auto; padding: 24px; }

  .btn { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 7px 12px; cursor: pointer; }
  .btn:hover { border-color: var(--navy); }
  .btn.primary { background: var(--navy); border-color: var(--navy); color: #fff; font-weight: 600; }
  .btn.primary:hover { background: #2c3a7a; }
  .btn.small { padding: 3px 8px; font-size: 12px; }
  .btn.danger { color: var(--danger); }

  section { padding: 16px 0 6px; border-bottom: 1px solid var(--line); }
  section:last-child { border-bottom: 0; }
  section > h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--navy); margin: 0 0 10px; }
  section > h2 small { text-transform: none; letter-spacing: 0; color: var(--muted); font-weight: 400; margin-left: 6px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; margin-bottom: 10px; }
  .grid .full { grid-column: 1 / -1; }
  label { display: block; font-size: 12px; color: var(--muted); }
  label > input, label > select, label > textarea { display: block; width: 100%; margin-top: 3px; }
  input[type=text], input[type=number], input[type=date], input[type=email], select, textarea {
    border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; background: #fff; color: var(--ink); min-width: 0;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--teal); outline-offset: -1px; }
  textarea { resize: vertical; line-height: 1.35; }
  .check { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink); }
  label.check > input { display: inline-block; width: auto; margin: 0; }
  input[hidden] { display: none !important; }
  .ocr { border: 1.5px dashed #9aa3c0; border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; background: #f6f7fb; font-size: 12px; color: var(--muted); }
  .ocr.over { border-color: var(--teal); background: #e8f6f6; }
  .ocr b { display: block; color: var(--navy); font-size: 13px; margin-bottom: 2px; }
  .ocr .btn { display: inline-block; color: var(--ink); }
  .btn.wa { background: #25D366; border-color: #25D366; color: #fff; font-weight: 600; }
  .btn.wa:hover { background: #1ebe5b; }
  a.btn.wa { text-decoration: none; display: inline-block; }
  a.btn.wa.off { opacity: .55; }
  .wa-row { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
  #waMsg { resize: vertical; font-size: 12px; width: 100%; }
  .wa-msg { display: block; margin-top: 6px; }
  .sv-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .sv-slots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .sv { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: #f6f7fb; font-size: 12px; }
  .sv.open { border-color: var(--teal); background: #e8f6f6; }
  .sv b { display: block; font-size: 13px; color: var(--navy); }
  .sv .amt { font-size: 15px; font-weight: 700; color: var(--ink); margin: 2px 0; }
  .sv .meta { color: var(--muted); }
  .sv { position: relative; cursor: pointer; text-align: left; }
  .sv:hover { border-color: var(--teal); }
  .sv .del { position: absolute; top: 4px; right: 6px; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 13px; padding: 2px 4px; }
  .sv .del:hover { color: var(--danger); }
  .sv-add { border: 1px dashed var(--line); border-radius: 8px; background: #fff; min-height: 74px; font-size: 26px; color: var(--navy); cursor: pointer; }
  .sv-add small { display: block; font-size: 11px; color: var(--muted); }
  .sv-add:hover { border-color: var(--teal); background: #e8f6f6; }
  @media (max-width: 520px) { .sv-slots { grid-template-columns: 1fr; } }
  .wa-lang { display: flex; margin-top: 8px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; width: max-content; }
  .wa-lang button { border: 0; background: #fff; padding: 5px 12px; font-size: 12px; cursor: pointer; color: var(--ink); }
  .wa-lang button.on { background: var(--navy); color: #fff; }
  .ocr textarea { width: 100%; margin: 4px 0 6px; font-size: 12px; resize: vertical; }
  .ocr-btns { display: flex; gap: 6px; }
  #ocrStatus { margin-top: 6px; color: var(--ink); white-space: pre-line; }
  #ocrStatus:empty { display: none; }
  .hint { font-size: 12px; color: var(--muted); margin: 0 0 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chip { border: 1px solid var(--line); background: #f6f7fb; border-radius: 999px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
  .chip:hover { border-color: var(--teal); background: #e8f6f6; }

  /*PARSE-END*/

  var OCR_LIB = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
  var FIELD_NAMES = { company: 'Company', pic: 'PIC name', position: 'Position', email: 'Email', tel: 'Tel', a1: 'Address' };
  function ocrStatus(msg) { $('ocrStatus').textContent = msg; }
  function loadOcr() {
    return new Promise(function (ok, fail) {
      if (window.Tesseract) return ok();
      var s = document.createElement('script');
      s.src = OCR_LIB;
      s.onload = function () { ok(); };
      s.onerror = function () { s.remove(); fail(new Error('load')); };
      document.head.appendChild(s);
    });
  }
  // turn any photo the browser can show into a clean, not-too-large picture for the reader
  // (very large phone photos and some formats otherwise fail)
  function prepareImage(file) {
    function toCanvas(src, w, h) {
      var max = 1600, k = Math.min(1, max / Math.max(w, h));
      if (w < 500) k = 800 / w;          // only very small screenshots are enlarged
      var c = document.createElement('canvas');
      c.width = Math.round(w * k); c.height = Math.round(h * k);
      var g = c.getContext('2d');
      g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
      g.drawImage(src, 0, 0, c.width, c.height);
      return c;
    }
    // 1st try: createImageBitmap (needs no blob: link); 2nd: a data: link; if both fail the
    // original file goes to the reader unchanged, as before
    var viaBitmap = window.createImageBitmap
      ? createImageBitmap(file).then(function (b) { return toCanvas(b, b.width, b.height); })
      : Promise.reject(new Error('no bitmap'));
    return viaBitmap.catch(function () {
      return new Promise(function (ok, fail) {
        var r = new FileReader();
        r.onload = function () {
          var img = new Image();
          img.onload = function () { ok(toCanvas(img, img.naturalWidth, img.naturalHeight)); };
          img.onerror = function () { fail(new Error('decode')); };
          img.src = r.result;
        };
        r.onerror = function () { fail(new Error('decode')); };
        r.readAsDataURL(file);
      });
    }).catch(function () { return file; });
  }
  var ocrBusy = false, ocrWorker = null, ocrPhase = '';
  // the reader is started once and kept, so the 2nd photo onwards is fast
  function getWorker() {
    if (!ocrWorker) {
      ocrWorker = loadOcr().then(function () {
        return window.Tesseract.createWorker('eng', 1, {
          langPath: 'https://cdn.jsdelivr.net/npm/@tesseract.js-data/eng@1.0.0/4.0.0_best_int',
          logger: function (m) {
            if (m.status === 'recognizing text') ocrStatus('Reading… 读取中 ' + Math.round(m.progress * 100) + '%');
            else if (ocrPhase === 'load' && m.progress) ocrStatus('Loading reader… 载入读取工具 ' + Math.round(m.progress * 100) + '%');
          }
        });
      });
      ocrWorker.catch(function () { ocrWorker = null; });
    }
    return ocrWorker;
  }
  function readImage(file) {
    if (!file || !/^image\//.test(file.type)) { ocrStatus('Not a photo. 不是照片'); return; }
    if (ocrBusy) return;
    ocrBusy = true;
    ocrPhase = 'load';
    ocrStatus(ocrWorker ? 'Reading… 读取中' : 'Loading reader… 载入读取工具');
    var stage = 'load', timer;
    Promise.all([prepareImage(file), getWorker()]).then(function (r) {
      stage = 'read'; ocrPhase = 'read';
      ocrStatus('Reading… 读取中');
      return Promise.race([
        r[1].recognize(r[0]),
        new Promise(function (ok, fail) { timer = setTimeout(function () { fail(new Error('timeout')); }, 60000); })
      ]);
    }).then(function (res) {
      clearTimeout(timer);
      applyFound(parseClient(res.data.text || ''));
    }).catch(function () {
      clearTimeout(timer);
      ocrStatus({
        load: 'The photo reader could not load. Check the internet connection. 读取工具载入失败，请检查网络。',
        read: 'Could not read this photo. Paste the text instead. 读不到照片，请直接贴文字。'
      }[stage]);
    }).then(function () { ocrBusy = false; ocrPhase = ''; });
  }
  function applyFound(found) {
    var keys = Object.keys(found);
    if (!keys.length) { ocrStatus('Nothing found. 找不到资料'); return; }
    if (found.a1) { state.client.a1 = state.client.a2 = state.client.a3 = ''; }
    keys.forEach(function (k) { state.client[k] = found[k]; });
    fillFields();
    renderPaper();
    var missing = Object.keys(FIELD_NAMES).filter(function (k) { return !found[k]; }).map(function (k) { return FIELD_NAMES[k]; });
    ocrStatus('✓ Filled 已填写' + (missing.length ? ' · Missing 缺少: ' + missing.join(', ') : ''));
  }
  function fillFromText() {
    var t = $('ocrText').value.trim();
    if (!t) { ocrStatus(''); return; }
    applyFound(parseClient(t));
  }
  $('ocrFill').addEventListener('click', fillFromText);
  // pasting text fills straight away
  $('ocrText').addEventListener('paste', function (e) {
    var cd = e.clipboardData;
    if (cd && Array.prototype.some.call(cd.items || [], function (it) { return it.kind === 'file' && /^image\//.test(it.type); })) return;
    setTimeout(fillFromText, 0);
  });
  $('ocrFile').addEventListener('change', function () { readImage(this.files[0]); this.value = ''; });
  ['dragenter', 'dragover'].forEach(function (ev) {
    $('ocrBox').addEventListener(ev, function (e) { e.preventDefault(); this.classList.add('over'); });
  });
  ['dragleave', 'drop'].forEach(function (ev) {
    $('ocrBox').addEventListener(ev, function (e) { e.preventDefault(); this.classList.remove('over'); });
  });
  $('ocrBox').addEventListener('drop', function (e) { readImage(e.dataTransfer.files[0]); });
  document.addEventListener('paste', function (e) {
    var items = (e.clipboardData && e.clipboardData.items) || [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].kind === 'file' && /^image\//.test(items[i].type)) { e.preventDefault(); readImage(items[i].getAsFile()); return; }
    }
  });

  // "New": first click asks on the button itself (browser pop-ups can be blocked), second click clears
  var resetTimer = null;
  $('btnReset').addEventListener('click', function () {
    var btn = this;
    if (!resetTimer) {
      btn.textContent = 'Clear all? 确定清除';
      btn.classList.add('danger');
      resetTimer = setTimeout(function () { resetTimer = null; btn.textContent = 'New'; btn.classList.remove('danger'); }, 4000);
      return;
    }
    clearTimeout(resetTimer); resetTimer = null;
    btn.textContent = 'New'; btn.classList.remove('danger');
    state = withTemplate(freshState(), TEMPLATES[0]);
    saved = { list: [] }; openId = null; storeSaved();
    save();
    $('ocrText').value = ''; ocrStatus('');
    fillFields(); renderItems(); renderPaper();
    $('form').scrollTop = 0; window.scrollTo(0, 0);
  });

  $('btnPdf').addEventListener('click', function () {
    var old = document.title;
    // the browser uses the page title as the suggested PDF file name
    document.title = ((state.term === 36 ? '3-year Promotion Worksy ' : '1-year Worksy Quotation ') + (state.client.company || state.ref)).replace(/[\\/:*?"<>|]/g, ' ');
    window.print();
    setTimeout(function () { document.title = old; }, 1000);
  });

  buildStatic();
  fillFields();
  renderItems();
  renderPaper();
  // lay the pages out again once the web font has arrived, since it changes how much fits on a page
  if (document.fonts && document.fonts.load) {
    Promise.all([document.fonts.load("9.5pt 'Carlito QB'"), document.fonts.load("700 9.5pt 'Carlito QB'")]).then(renderPaper, function () {});
  }
})();
</script>
</body>
</html>
